[package]
name = "kasir-pos"
version = "0.1.0"
description = "POS offline-first untuk UMKM Indonesia"
edition = "2021"
rust-version = "1.77"

[lib]
name = "kasir_pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# bundled = compile SQLite from source, no system dependency (offline-friendly).
rusqlite = { version = "0.32", features = ["bundled"] }
